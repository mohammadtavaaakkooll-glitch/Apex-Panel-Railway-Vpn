<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex MTProto · Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root { --bg:#0b0e14; --card:#141821; --border:#232a36; --text:#e6edf3; --muted:#7d8590; --accent:#2f81f7; --accent-hover:#4a9eff; --success:#3fb950; --danger:#f85149; --warning:#d29922; --shadow:0 8px 32px rgba(0,0,0,0.5); }
[data-theme="light"] { --bg:#f6f8fa; --card:#fff; --border:#d0d7de; --text:#1f2328; --muted:#656d76; --shadow:0 8px 32px rgba(0,0,0,0.1); }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif; }
body { min-height:100vh; background:var(--bg); color:var(--text); padding:24px; }
body::before { content:''; position:fixed; inset:0; background:radial-gradient(circle at 10% 10%,rgba(47,129,247,0.08),transparent 40%),radial-gradient(circle at 90% 90%,rgba(88,166,255,0.05),transparent 40%); pointer-events:none; z-index:0; }
.container { position:relative; z-index:1; max-width:1200px; margin:0 auto; }
.header { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 26px; margin-bottom:20px; box-shadow:var(--shadow); }
.brand { display:flex; align-items:center; gap:14px; }
.brand-logo { width:44px; height:44px; border-radius:12px; }
.brand-name { font-size:19px; font-weight:900; background:linear-gradient(135deg,#2f81f7,#79c0ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.brand-sub { font-size:10px; color:var(--muted); letter-spacing:2px; margin-top:2px; }
.actions { display:flex; gap:8px; align-items:center; }
.icon-btn { width:38px; height:38px; background:var(--bg); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:16px; transition:all 0.2s; }
.icon-btn:hover { border-color:var(--accent); color:var(--accent); }
.logout { color:var(--danger); text-decoration:none; font-weight:700; font-size:13px; padding:10px 18px; border-radius:10px; background:rgba(248,81,73,0.1); border:1px solid rgba(248,81,73,0.2); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px; }
.stat { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.stat::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:scan 3s linear infinite; }
@keyframes scan { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
.stat-label { font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
.stat-value { font-size:26px; font-weight:900; background:linear-gradient(135deg,#2f81f7,#79c0ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.stat.green .stat-value { background:linear-gradient(135deg,#3fb950,#7ee787); -webkit-background-clip:text; }
.stat.red .stat-value { background:linear-gradient(135deg,#f85149,#ff7b72); -webkit-background-clip:text; }
.panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:20px; box-shadow:var(--shadow); }
.section-title { font-size:12px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; font-weight:700; }
.section-title::before { content:'// '; color:var(--accent); }
.form-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.input { flex:1; min-width:140px; padding:13px 16px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; font-family:inherit; outline:none; transition:all 0.2s; }
.input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(47,129,247,0.15); }
.btn { padding:13px 24px; background:var(--accent); border:none; border-radius:10px; color:#fff; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; transition:all 0.2s; }
.btn:hover { background:var(--accent-hover); transform:translateY(-2px); box-shadow:0 8px 20px rgba(47,129,247,0.4); }
.btn-danger { background:var(--danger); }
.btn-success { background:var(--success); }
.btn-warning { background:var(--warning); }
.btn-sm { padding:8px 16px; font-size:12px; }
table { width:100%; border-collapse:collapse; }
th, td { padding:13px 14px; text-align:right; border-bottom:1px solid var(--border); font-size:13px; }
th { color:var(--muted); font-size:10px; letter-spacing:2px; text-transform:uppercase; font-weight:700; }
tr:hover td { background:rgba(47,129,247,0.04); }
.badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:10px; font-weight:700; }
.badge-active { background:rgba(63,185,80,0.15); color:var(--success); }
.badge-disabled { background:rgba(248,81,73,0.15); color:var(--danger); }
.act { cursor:pointer; font-size:15px; margin-right:8px; transition:transform 0.2s; display:inline-block; }
.act:hover { transform:scale(1.3); }
.act.copy { color:var(--accent); } .act.del { color:var(--danger); }
.mono { font-family:monospace; font-size:11px; opacity:0.7; }
.empty { text-align:center; color:var(--muted); padding:40px; }
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 24px; box-shadow:var(--shadow); z-index:9999; transition:transform 0.4s; font-weight:600; }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.success { border-color:var(--success); color:var(--success); }
.toast.error { border-color:var(--danger); color:var(--danger); }
.link-box { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; font-family:monospace; font-size:12px; word-break:break-all; margin-top:12px; color:var(--accent); }
@media (max-width:640px) { .header { flex-direction:column; gap:16px; } .form-row { flex-direction:column; } .btn { width:100%; } }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="brand">
      <img class="brand-logo" src="https://ui-avatars.com/api/?name=AP&background=2f81f7&color=fff&size=88&bold=true&font-size=0.5">
      <div>
        <div class="brand-name">APEX MTPROTO</div>
        <div class="brand-sub">TELEGRAM PROXY PANEL</div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="themeToggle">🌙</button>
      <button class="icon-btn" onclick="refresh()">🔄</button>
      <a href="/logout" class="logout">خروج</a>
    </div>
  </div>

  <!-- آمار -->
  <div class="stats">
    <div class="stat"><div class="stat-label">کل کاربران</div><div class="stat-value" id="s_total">0</div></div>
    <div class="stat green"><div class="stat-label">فعال</div><div class="stat-value" id="s_active">0</div></div>
    <div class="stat"><div class="stat-label">اتصالات</div><div class="stat-value" id="s_conn">0</div></div>
    <div class="stat" id="proxyStatusCard"><div class="stat-label">وضعیت پروکسی</div><div class="stat-value" id="s_proxy">—</div></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">CPU</div><div class="stat-value" id="s_cpu">0%</div></div>
    <div class="stat"><div class="stat-label">RAM</div><div class="stat-value" id="s_ram">0%</div></div>
    <div class="stat"><div class="stat-label">آپ‌تایم</div><div class="stat-value" style="font-size:16px" id="s_uptime">—</div></div>
    <div class="stat"><div class="stat-label">پورت</div><div class="stat-value" style="font-size:16px" id="s_port">—</div></div>
  </div>

  <!-- کنترل پروکسی -->
  <div class="panel">
    <div class="section-title">کنترل پروکسی</div>
    <div class="form-row">
      <button class="btn btn-success" onclick="proxyControl('start')">▶️ روشن</button>
      <button class="btn btn-danger" onclick="proxyControl('stop')">⏹ خاموش</button>
      <button class="btn btn-warning" onclick="proxyControl('restart')">🔄 ری‌استارت</button>
      <button class="btn" onclick="showLink()">🔗 لینک پروکسی</button>
    </div>
    <div id="linkBox"></div>
  </div>

  <!-- ساخت کاربر -->
  <div class="panel">
    <div class="section-title">ساخت کاربر</div>
    <div class="form-row">
      <input class="input" id="c_name" placeholder="اسم کاربر">
      <input class="input" type="number" id="c_expire" placeholder="انقضا (روز) — اختیاری">
      <button class="btn" onclick="createUser()">➕ ساخت</button>
    </div>
  </div>

  <!-- ساخت انبوه -->
  <div class="panel">
    <div class="section-title">ساخت انبوه</div>
    <div class="form-row">
      <input class="input" id="b_prefix" placeholder="پیشوند" value="user">
      <input class="input" type="number" id="b_count" placeholder="تعداد" value="10">
      <input class="input" type="number" id="b_expire" placeholder="انقضا (روز)" value="30">
      <button class="btn btn-success" onclick="bulkCreate()">⚡ ساخت</button>
    </div>
  </div>

  <!-- کاربران -->
  <div class="panel">
    <div class="section-title">کاربران</div>
    <table>
      <thead><tr><th>نام</th><th>سکرت</th><th>وضعیت</th><th>انقضا</th><th>عملیات</th></tr></thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>

  <!-- تنظیمات -->
  <div class="panel">
    <div class="section-title">تنظیمات</div>
    <div class="form-row">
      <input class="input" id="st_server_ip" placeholder="دامنه سرور (مثلاً your-app.up.railway.app)">
      <input class="input" type="number" id="st_port" placeholder="پورت">
    </div>
    <div class="form-row">
      <input class="input" id="st_proxy_tag" placeholder="تگ پروکسی (APEX)">
      <input class="input" id="st_secret" placeholder="سکرت اصلی">
    </div>
    <button class="btn" onclick="saveSettings()">💾 ذخیره</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const themeToggle = document.getElementById('themeToggle');
function setTheme(t) { document.documentElement.dataset.theme = t; themeToggle.textContent = t === 'dark' ? '🌙' : '☀️'; localStorage.setItem('apex_theme', t); }
themeToggle.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
setTheme(localStorage.getItem('apex_theme') || 'dark');

function toast(m, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 2500);
}

let allUsers = [];

async function loadStats() {
  const s = await (await fetch('/api/stats')).json();
  document.getElementById('s_total').textContent = s.total_users;
  document.getElementById('s_active').textContent = s.active_users;
  document.getElementById('s_conn').textContent = s.connections;
  document.getElementById('s_cpu').textContent = (s.cpu || 0) + '%';
  document.getElementById('s_ram').textContent = (s.ram || 0) + '%';
  document.getElementById('s_uptime').textContent = s.uptime || '—';

  const statusEl = document.getElementById('s_proxy');
  statusEl.textContent = s.proxy_running ? 'آنلاین' : 'آفلاین';
  statusEl.style.color = s.proxy_running ? 'var(--success)' : 'var(--danger)';
}

async function loadLink() {
  const d = await (await fetch('/api/proxy/link')).json();
  document.getElementById('s_port').textContent = d.port;
  document.getElementById('st_server_ip').value = d.server;
  document.getElementById('st_port').value = d.port;
}

async function loadUsers() {
  allUsers = await (await fetch('/api/users')).json();
  const tbody = document.getElementById('usersTable');
  if (!allUsers.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">هنوز کاربری نساختی</td></tr>';
    return;
  }
  tbody.innerHTML = allUsers.map(u => `
    <tr>
      <td>${u.name}</td>
      <td class="mono">${u.secret.slice(0, 12)}…</td>
      <td><span class="badge badge-${u.status === 'active' ? 'active' : 'disabled'}">${u.status === 'active' ? 'فعال' : 'غیرفعال'}</span></td>
      <td class="mono">${u.expire_at ? new Date(u.expire_at).toLocaleDateString('fa-IR') : '—'}</td>
      <td>
        <span class="act copy" onclick="copyLink('${u.link}')" title="کپی لینک">📋</span>
        <span class="act del" onclick="delUser('${u.id}')" title="حذف">✕</span>
      </td>
    </tr>
  `).join('');
}

async function createUser() {
  const name = document.getElementById('c_name').value.trim();
  const exp = parseInt(document.getElementById('c_expire').value) || 0;
  if (!name) return toast('اسم بده', 'error');
  const r = await fetch('/api/users', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name, expire_days: exp}) });
  if (r.ok) { toast('✅ ساخته شد'); document.getElementById('c_name').value=''; loadUsers(); loadStats(); }
  else toast('خطا', 'error');
}

async function bulkCreate() {
  const prefix = document.getElementById('b_prefix').value || 'user';
  const count = parseInt(document.getElementById('b_count').value) || 10;
  const exp = parseInt(document.getElementById('b_expire').value) || 0;
  if (!confirm(`${count} کاربر ساخته شود؟`)) return;
  await fetch('/api/users/bulk', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({prefix, count, expire_days: exp}) });
  toast(`✅ ${count} ساخته شد`); loadUsers(); loadStats();
}

async function delUser(id) {
  if (!confirm('حذف؟')) return;
  await fetch('/api/users/' + id, { method: 'DELETE' });
  toast('🗑 حذف شد'); loadUsers(); loadStats();
}

async function proxyControl(action) {
  const r = await fetch('/api/proxy/' + action, { method: 'POST' });
  const d = await r.json();
  toast(d.ok ? `✅ ${d.message}` : `❌ ${d.message}`, d.ok ? 'success' : 'error');
  loadStats();
}

async function showLink() {
  const d = await (await fetch('/api/proxy/link')).json();
  const box = document.getElementById('linkBox');
  box.innerHTML = `
    <div class="link-box" onclick="copyLink('${d.link}')" style="cursor:pointer">
      <b>tg://</b> ${d.link}
    </div>
    <div class="link-box" onclick="copyLink('${d.https_link}')" style="cursor:pointer">
      <b>https://</b> ${d.https_link}
    </div>
    <div style="margin-top:8px;color:var(--muted);font-size:12px">👆 کلیک کن تا کپی شه</div>
  `;
}

function copyLink(text) {
  navigator.clipboard.writeText(text).then(() => toast('📋 کپی شد'));
}

async function loadSettings() {
  const s = await (await fetch('/api/settings')).json();
  document.getElementById('st_server_ip').value = s.server_ip || '';
  document.getElementById('st_port').value = s.port || '';
  document.getElementById('st_proxy_tag').value = s.proxy_tag || '';
  document.getElementById('st_secret').value = s.secret || '';
}

async function saveSettings() {
  const d = {
    server_ip: document.getElementById('st_server_ip').value,
    port: parseInt(document.getElementById('st_port').value),
    proxy_tag: document.getElementById('st_proxy_tag').value,
    secret: document.getElementById('st_secret').value
  };
  await fetch('/api/settings', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(d) });
  toast('💾 ذخیره شد');
  loadStats();
}

function refresh() { loadStats(); loadUsers(); loadLink(); toast('🔄 بروزرسانی'); }

loadStats(); loadUsers(); loadLink(); loadSettings();
setInterval(loadStats, 5000);
</script>
</body>
</html>
